{% extends "base.html" %}
{% block title %}Sign in — Foodie{% endblock %}
{% block content %}
<div class="auth-layout"><div class="auth-art"><span>🍕</span><h2>Good food.<br>Good mood.</h2><p>Sign in to place an order and keep track of your favourites.</p></div>
<div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in</h1><p class="muted">Enter your account details below.</p>
<form method="post" class="form-stack">
<label>Email address<input type="email" name="email" placeholder="you@example.com" required autocomplete="email"></label>
<label>Password<input type="password" name="password" placeholder="Your password" required autocomplete="current-password"></label>
<button class="button full-button" type="submit">Sign in</button>
</form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>
{% endblock %}
